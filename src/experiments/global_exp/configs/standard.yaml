# Global ABE end-to-end experiment -- standard configuration.
# Primary benchmark: median of 20 repetitions, 3 warm-ups, policies 10..160
# rows (all even -> satisfaction ratio exactly 0.5).  Estimated ~10-15 min.
mode: standard
master_seed: 20260812
pairing_group: MNT224
secparam: 512
satisfaction_ratio: 0.5
satisfaction_tolerance: 0.1

schemes: [FABEO22, FXABE-Base, FXABE-Full]
user_capacity: 64

repetitions: 20
warmups: 3

policy_rows: [10, 20, 40, 80, 160]
user_attrs: [5, 10, 20, 40, 80]
exp02_policy_rows: 4

exp08:
  policy_rows: 80
  repetitions: 20
