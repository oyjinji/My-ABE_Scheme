# Global ABE end-to-end experiment -- full configuration.
# Deep statistical run: 50 repetitions, 5 warm-ups, policies up to 320 rows.
# NOTE: heavy -- only run after the standard run demonstrates feasibility
# (see src/experiments/global_exp/results/*/logs/runtime_projection.json).  Estimated
# 45-90 minutes on the reference machine.
mode: full
master_seed: 20260812
pairing_group: MNT224
secparam: 512
satisfaction_ratio: 0.5
satisfaction_tolerance: 0.1

schemes: [FABEO22, FXABE-Base, FXABE-Full]
user_capacity: 64

repetitions: 50
warmups: 5

policy_rows: [10, 20, 40, 80, 160, 320]
user_attrs: [5, 10, 20, 40, 80, 160]
exp02_policy_rows: 4

exp08:
  policy_rows: 160
  repetitions: 50
