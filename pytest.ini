[pytest]
pythonpath = src
markers =
    sgx: requires an explicitly enabled real Gramine SGX DEBUG integration run
    real_sgx_public: requires MYABE08_RUN_SGX_PUBLIC=1 and real QVL/PCCS
    real_sgx_experiment_smoke: Phase 4F real Gramine SGX experiment harness smoke
    real_sgx_phase5c: Phase 5C real Gramine SGX exact-set and fault-injection smoke
